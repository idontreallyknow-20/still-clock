<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Still</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="booting">
<div id="titlebar"></div>
<canvas id="bg"></canvas>
<canvas id="sky"></canvas>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<main id="stage">
  <div id="face"></div>
  <div id="meta">
    <div id="progress"><i></i></div>
    <div id="date"><span id="ampm"></span><span id="dtext"></span></div>
    <div id="wx"></div>
  </div>
</main>
<div id="toast"></div>
<div id="err" role="status"></div>
<div id="fslock"><div><p>Click to return to fullscreen</p><button id="fsunlock">turn off lock</button></div></div>
<div id="hint">click anywhere to wake the sound</div>
<div id="music" aria-hidden="true">
  <img id="m-art" alt="">
  <div class="m-txt"><p id="m-title"></p><p id="m-artist"></p>
    <div class="m-prog"><i id="m-bar"></i></div><p id="m-time"></p></div>
  <div class="m-ctl">
    <button data-m="prev" aria-label="Previous"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button data-m="toggle" class="m-pp" aria-label="Play or pause"><svg class="m-pause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><svg class="m-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <button data-m="next" aria-label="Next"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
</div>
<div id="dim" aria-hidden="true"></div>
<div id="alarm" role="alertdialog" aria-hidden="true" aria-labelledby="alarm-time">
  <p class="al-k">Good morning</p>
  <p id="alarm-time"></p>
  <div class="al-b"><button id="alarm-snooze">Snooze 9 min</button><button id="alarm-stop">Stop</button></div>
</div>

<div id="quick" title="Brightness (↑ ↓)">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
  <input id="qb" type="range" min="0.1" max="1" step="0.01" aria-label="Brightness">
  <span id="qbv"></span>
</div>
<button id="gear" aria-label="Settings" title="Settings (S)">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
</button>

<aside id="panel" aria-hidden="true" aria-label="Settings">
  <header><span class="brand">Still</span><button class="close" aria-label="Close">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div id="rows"></div>
  <footer>
    <div class="btns"><button data-act="fullscreen">Fullscreen</button><button data-act="reset">Reset</button><button data-act="install" hidden>Install app</button></div>
    <p class="keys">S settings · F fullscreen · M mute · 1–5 face<br>P palette · W weather · T timelapse<br>↑↓ brightness · Space aurora surge</p>
    <p class="credit">made by <b>Joseph</b></p>
  </footer>
</aside>

<script type="importmap">{ "imports": { "three": "./js/vendor/three.module.min.js", "three/addons/": "./js/vendor/addons/" } }</script>
<script src="js/store.js"></script>
<script src="js/astro.js"></script>
<script src="js/moon.js"></script>
<script src="js/audio.js"></script>
<script src="js/bg.js"></script>
<script src="js/fx.js"></script>
<script src="js/sky.js"></script>
<script src="js/faces.js"></script>
<script src="js/spotify.js"></script>
<script src="js/beat.js"></script>
<script src="js/listen.js"></script>
<script src="js/ui.js"></script>
<!-- the 3D layer is a module; main.js waits for it (deferred scripts and modules run in order) -->
<script type="module" src="js/gl3d.js"></script>
<script defer src="js/main.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
